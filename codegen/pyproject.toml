[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rboto-codegen"
version = "0.1.0"
description = "rboto: generate typed Python clients, Rust bindings, and operation references. Alpha preview."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Leandro Cavalcante Damascena", email = "leandro.damascena@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
keywords = ["rboto", "smithy", "codegen", "rust", "python"]
dependencies = ["jinja2>=3.1"]

[project.urls]
Documentation = "https://ferrumio.github.io/rboto"
Repository = "https://github.com/ferrumio/rboto"
Homepage = "https://ferrumio.github.io/rboto/"
Issues = "https://github.com/ferrumio/rboto/issues"
Changelog = "https://github.com/ferrumio/rboto/releases"

[project.scripts]
rboto-codegen = "rboto_codegen.cli:main"

[dependency-groups]
test = ["pytest>=8.3", "mypy>=1.15", "pyright>=1.1.400"]

[tool.hatch.build.targets.wheel]
packages = ["src/rboto_codegen"]
artifacts = ["src/rboto_codegen/services/*.toml", "src/rboto_codegen/templates/*"]

[tool.mypy]
strict = true
