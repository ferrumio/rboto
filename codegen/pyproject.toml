[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rboto-codegen"
version = "0.1.0"
description = "Python code generator for rboto service packages"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Leandro Cavalcante Damascena", email = "leandro.damascena@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["aws", "smithy", "codegen", "rust", "python"]
dependencies = ["jinja2>=3.1"]

[project.urls]
Documentation = "https://ferrumio.github.io/rboto"
Repository = "https://github.com/ferrumio/rboto"
Homepage = "https://github.com/ferrumio/rboto"

[project.scripts]
rboto-codegen = "rboto_codegen.cli:main"

[dependency-groups]
test = ["pytest>=8.3", "mypy>=1.15", "pyright>=1.1.400"]

[tool.hatch.build.targets.wheel]
packages = ["src/rboto_codegen"]
artifacts = ["src/rboto_codegen/services/*.toml", "src/rboto_codegen/templates/*"]

[tool.mypy]
strict = true
