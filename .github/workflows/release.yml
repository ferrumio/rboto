name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version already present in all manifests"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      services: ${{ steps.release.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          python .github/scripts/check_version.py --expected "$VERSION"
          python -m venv .venv
          .venv/bin/pip install -e codegen
          SERVICES=$(.venv/bin/rboto-codegen list --json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  linux-x86:
    name: ${{ matrix.service }} manylinux x86_64 cp${{ matrix.python }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.15.0"
          target: x86_64
          args: --release --locked --out dist -i python${{ matrix.python }}
          manylinux: "2_17"
          working-directory: packages/rboto-${{ matrix.service }}
          sccache: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-${{ matrix.service }}-cp${{ matrix.python }}-manylinux-x86_64
          path: packages/rboto-${{ matrix.service }}/dist/*.whl

  linux-arm:
    name: ${{ matrix.service }} manylinux aarch64 cp${{ matrix.python }}
    needs: prepare
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.15.0"
          target: aarch64
          args: --release --locked --out dist -i python${{ matrix.python }}
          manylinux: "2_17"
          working-directory: packages/rboto-${{ matrix.service }}
          sccache: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-${{ matrix.service }}-cp${{ matrix.python }}-manylinux-aarch64
          path: packages/rboto-${{ matrix.service }}/dist/*.whl

  macos-x86:
    name: ${{ matrix.service }} macOS x86_64 cp${{ matrix.python }}
    needs: prepare
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.15.0"
          target: x86_64-apple-darwin
          args: --release --locked --out dist -i python${{ matrix.python }}
          working-directory: packages/rboto-${{ matrix.service }}
          sccache: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-${{ matrix.service }}-cp${{ matrix.python }}-macos-x86_64
          path: packages/rboto-${{ matrix.service }}/dist/*.whl

  macos-arm:
    name: ${{ matrix.service }} macOS arm64 cp${{ matrix.python }}
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.15.0"
          target: aarch64-apple-darwin
          args: --release --locked --out dist -i python${{ matrix.python }}
          working-directory: packages/rboto-${{ matrix.service }}
          sccache: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-${{ matrix.service }}-cp${{ matrix.python }}-macos-arm64
          path: packages/rboto-${{ matrix.service }}/dist/*.whl

  service-sdist:
    name: ${{ matrix.service }} sdist
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.15.0"
          command: sdist
          args: --out dist
          working-directory: packages/rboto-${{ matrix.service }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-${{ matrix.service }}-sdist
          path: packages/rboto-${{ matrix.service }}/dist/*.tar.gz

  core:
    name: Core wheel and sdist
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --outdir dist packages/rboto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core
          path: dist/*

  smoke-wheelhouse:
    name: Smoke test ${{ matrix.platform.artifact }} / Python ${{ matrix.python }}
    needs: [prepare, linux-x86, linux-arm, macos-x86, macos-arm, core]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        platform:
          - { runner: ubuntu-latest, artifact: manylinux-x86_64 }
          - { runner: ubuntu-24.04-arm, artifact: manylinux-aarch64 }
          - { runner: macos-15-intel, artifact: macos-x86_64 }
          - { runner: macos-latest, artifact: macos-arm64 }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: service-*-cp${{ matrix.python }}-${{ matrix.platform.artifact }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core
          path: dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install all extras from wheelhouse
        run: |
          python -m venv .venv
          .venv/bin/pip install --no-index --find-links dist "rboto[all]==${{ needs.prepare.outputs.version }}"
          .venv/bin/python -c "import rboto; [getattr(rboto, name)() for name in rboto.__all__ if name != 'Session']"

  publish-services:
    name: Publish service distributions
    needs: [prepare, linux-x86, linux-arm, macos-x86, macos-arm, service-sdist, smoke-wheelhouse]
    runs-on: ubuntu-latest
    environment:
      name: pypi-services
      url: https://pypi.org/search/?q=rboto
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: service-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  publish-core:
    name: Publish rboto core last
    needs: [prepare, core, publish-services]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rboto
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  github-release:
    name: Create GitHub release
    needs: [prepare, publish-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Publish release and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ needs.prepare.outputs.version }}"
          dist/* --target "$GITHUB_SHA" --generate-notes

  docs:
    needs: github-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
