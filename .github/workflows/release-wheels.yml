name: Release wheels

on:
  workflow_call:
    inputs:
      services:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      manylinux:
        type: string
        default: ""
      container:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.service }} / ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'macOS'
        with:
          python-version: |
            3.12
            3.13
            3.14
            3.15
      - name: Build four CPython wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.15.0"
          target: ${{ inputs.target }}
          manylinux: ${{ inputs.manylinux }}
          container: ${{ inputs.container }}
          args: --release --locked --out dist -i python3.12 python3.13 python3.14 python3.15
          working-directory: packages/rboto-${{ matrix.service }}
          sccache: true
          before-script-linux: |
            export CARGO_BUILD_JOBS=2
            export PATH="$PATH:/opt/python/cp312-cp312/bin:/opt/python/cp313-cp313/bin:/opt/python/cp314-cp314/bin:/opt/python/cp315-cp315/bin"
            case "${{ inputs.target }}" in
              *-musl) export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=-crt-static" ;;
            esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service--${{ matrix.service }}--${{ inputs.platform }}
          path: packages/rboto-${{ matrix.service }}/dist/*.whl
          if-no-files-found: error
          retention-days: 14
