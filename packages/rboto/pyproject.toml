[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rboto"
version = "0.1.0"
description = "Async-only Python facade for rboto AWS service clients"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Leandro Cavalcante Damascena", email = "leandro.damascena@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
keywords = ["aws", "sdk", "async", "rust", "python"]

[project.urls]
Documentation = "https://ferrumio.github.io/rboto"
Repository = "https://github.com/ferrumio/rboto"
Homepage = "https://github.com/ferrumio/rboto"

[project.optional-dependencies]
s3 = ["rboto-s3==0.1.0"]
sqs = ["rboto-sqs==0.1.0"]
dynamodb = ["rboto-dynamodb==0.1.0"]
all = [
    "rboto-s3==0.1.0",
    "rboto-sqs==0.1.0",
    "rboto-dynamodb==0.1.0",
]

[dependency-groups]
test = [
    "mypy>=1.15",
    "pyright>=1.1.400",
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rboto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
