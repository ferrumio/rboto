[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Leandro Cavalcante Damascena <leandro.damascena@gmail.com>"]
description = "Async, strictly typed Python clients powered by the AWS SDK for Rust"
license = "Apache-2.0"
repository = "https://github.com/ferrumio/rboto"
homepage = "https://github.com/ferrumio/rboto"
documentation = "https://ferrumio.github.io/rboto"
keywords = ["aws", "python", "rust", "async", "pyo3"]
categories = ["api-bindings", "web-programming"]
rust-version = "1.94.1"

[workspace.dependencies]
futures-util = "0.3"
aws-config = "=1.13.0"
aws-smithy-async = "=1.3.1"
aws-smithy-runtime-api = "=1.19.1"
aws-smithy-types = "=1.9.0"
pyo3 = { version = "=0.27.2", features = ["extension-module"] }
pyo3-async-runtimes = { version = "=0.27.0", features = ["tokio-runtime"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
