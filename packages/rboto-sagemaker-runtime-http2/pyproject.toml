[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "rboto-sagemaker-runtime-http2"
version = "0.1.0"
description = "Async generated sagemaker-runtime-http2 client for rboto, powered by the AWS SDK for Rust"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Leandro Cavalcante Damascena", email = "leandro.damascena@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
keywords = ["aws", "sagemaker-runtime-http2", "async", "rust", "python"]
dependencies = ["rboto==0.1.0"]

[project.urls]
Documentation = "https://ferrumio.github.io/rboto"
Repository = "https://github.com/ferrumio/rboto"
Homepage = "https://github.com/ferrumio/rboto"

[tool.maturin]
manifest-path = "../../crates/rboto-sagemaker-runtime-http2/Cargo.toml"
python-source = "python"
module-name = "rboto_sagemaker_runtime_http2._native"
features = ["pyo3/extension-module"]
