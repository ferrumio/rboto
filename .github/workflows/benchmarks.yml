name: Benchmarks

on:
  pull_request:
    paths: ["benchmarks/**", "crates/**", "packages/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codspeed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build benchmark environment
        run: |
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.15,<2" pytest pytest-codspeed pytest-benchmark
          .venv/bin/pip install -e packages/rboto
          (cd packages/rboto-s3 && ../../.venv/bin/maturin develop --release --locked)
          (cd packages/rboto-sns && ../../.venv/bin/maturin develop --release --locked)
          (cd packages/rboto-sqs && ../../.venv/bin/maturin develop --release --locked)
          (cd packages/rboto-dynamodb && ../../.venv/bin/maturin develop --release --locked)
      - uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: walltime
          run: .venv/bin/pytest benchmarks --codspeed
