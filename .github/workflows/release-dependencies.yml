name: Release dependency preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**/pyproject.toml"
      - "codegen/src/rboto_codegen/templates/**"
      - ".github/scripts/release_dependencies.py"
      - ".github/workflows/release*.yml"
      - "codegen/tests/test_release_dependencies.py"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, container: "quay.io/pypa/manylinux2014_x86_64:latest" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux2014_aarch64:latest" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, container: "quay.io/pypa/musllinux_1_2_x86_64:latest" }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/musllinux_1_2_aarch64:latest" }
          - { name: macos-x86_64, runner: macos-15-intel, container: "" }
          - { name: macos-arm64, runner: macos-latest, container: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Discover package dependencies
        run: |
          python3.12 -m venv .dependency-tools
          .dependency-tools/bin/pip install packaging
          .dependency-tools/bin/python .github/scripts/release_dependencies.py requirements
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.platform.container == ''
        with:
          python-version: |
            3.12
            3.13
            3.14
            3.15
      - name: Download and check dependencies on macOS
        if: matrix.platform.container == ''
        shell: bash
        run: |
          for version in 3.12 3.13 3.14 3.15; do
            wheels="dependencies/cp${version//./}"
            "python$version" .github/scripts/release_dependencies.py download --wheels "$wheels"
            "python$version" .github/scripts/release_dependencies.py check --wheels "$wheels"
          done
      - name: Download Linux dependencies in their target environment
        if: matrix.platform.container != ''
        env:
          IMAGE: ${{ matrix.platform.container }}
        run: |
          docker run --rm --cpus 2 --memory 4g \
            -v "$PWD:/io" -w /io "$IMAGE" sh -eu -c '
              for abi in cp312 cp313 cp314 cp315; do
                /opt/python/$abi-$abi/bin/python .github/scripts/release_dependencies.py \
                  download --wheels "dependencies/$abi"
              done
            '
      - name: Check Linux dependency installation without network
        if: matrix.platform.container != ''
        env:
          IMAGE: ${{ matrix.platform.container }}
        run: |
          docker run --rm --network none --cpus 2 --memory 4g \
            -v "$PWD:/io:ro" -w /io "$IMAGE" sh -eu -c '
              for abi in cp312 cp313 cp314 cp315; do
                /opt/python/$abi-$abi/bin/python .github/scripts/release_dependencies.py \
                  check --wheels "dependencies/$abi"
              done
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependencies--${{ matrix.platform.name }}
          path: |
            dependencies/requirements.txt
            dependencies/**/*.whl
          if-no-files-found: error
          overwrite: true
          retention-days: 14
