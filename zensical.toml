site_name = "rboto"
site_description = "Async, strictly typed AWS clients for Python powered by Rust"
site_url = "https://ferrumio.github.io/rboto"
repo_url = "https://github.com/ferrumio/rboto"
repo_name = "ferrumio/rboto"

nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Async-only" = "guides/async-only.md" },
    { "Clients" = "clients.md" },
    { "Operation reference" = "reference.md" },
    { "Using rboto" = [
        { "Configuration and credentials" = "guides/configuration.md" },
        { "Closing clients and streams" = "guides/lifecycle.md" },
        { "Runtime workers" = "guides/runtime.md" },
        { "Types and responses" = "guides/types.md" },
        { "Pagination" = "guides/pagination.md" },
        { "Waiters" = "guides/waiters.md" },
        { "Pydantic and dataclasses" = "guides/models.md" },
        { "AWS Lambda" = "guides/aws-lambda.md" },
        { "Streaming" = "guides/streaming.md" },
        { "Errors" = "guides/errors.md" },
        { "Interceptors" = "guides/interceptors.md" },
        { "Logging" = "guides/logging.md" },
        { "OpenTelemetry" = "guides/opentelemetry.md" },
        { "Testing" = "guides/testing.md" },
        { "Code generation evaluations" = "guides/code-evaluations.md" },
    ] },
    { "Service guides" = [
        { "Athena" = "guides/athena.md" },
        { "Glue" = "guides/glue.md" },
        { "S3" = "guides/s3.md" },
        { "DynamoDB" = "guides/dynamodb.md" },
        { "SNS and SQS" = "guides/messaging.md" },
        { "Lambda and Bedrock" = "guides/inference.md" },
        { "Events and schedules" = "guides/events.md" },
        { "Application services" = "guides/application-services.md" },
    ] },
]

[theme]
name = "material"
features = ["navigation.sections", "content.code.copy", "content.code.annotate"]

[[theme.palette]]
scheme = "default"
primary = "deep purple"
accent = "amber"
[theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[theme.palette]]
scheme = "slate"
primary = "deep purple"
accent = "amber"
[theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[markdown_extensions]
admonition = {}

[markdown_extensions."pymdownx.highlight"]
anchor_linenums = true

[markdown_extensions."pymdownx.superfences"]

[markdown_extensions."pymdownx.tabbed"]
alternate_style = true


[markdown_extensions."pymdownx.snippets"]
base_path = "."
check_paths = true
