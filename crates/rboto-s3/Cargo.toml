[package]
name = "rboto-s3-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aws-config.workspace = true
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-async.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
rboto-core = { path = "../rboto-core" }
tokio.workspace = true

[package.metadata.maturin]
python-source = "../../packages/rboto-s3/python"
module-name = "rboto_s3._native"
