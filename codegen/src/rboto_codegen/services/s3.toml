service_id = "s3"
display_name = "Amazon S3"
documentation_path = "guides/s3/"
python_name = "s3"
distribution_name = "rboto-s3"
python_package = "rboto_s3"
client_class = "S3Client"
adapter_crate = "rboto-s3-native"
rust_crate = "aws-sdk-s3"
rust_module = "aws_sdk_s3"
rust_crate_version = "1.155.0"
rust_features = ["sigv4a", "http-1x"]
model_url = "https://raw.githubusercontent.com/awslabs/aws-sdk-rust/release-2026-10-22/aws-models/s3.json"
model_sha256 = "57431518807d8565e103b9bcc8f2610950e725645e28374e746bdf8e300cc37a"
aws_model_hash = "e4c230adf13e968c640273af055cfdee3a37f9c7302084994d196ec6b6d6cfc9"
smithy_codegen_revision = "05b51124ec26a1bc5ad4330ac2803b46b8a4b337"
customization = "s3"
force_path_style_for_custom_endpoint = true
native_outputs = true

# The SDK retains the original header alongside its parsed timestamp.
[[alignment_extras]]
operation = "get_object"
member = "expires_string"
rust_type = "::std::string::String"
optional = true
reason = "Raw Expires header retained alongside the modeled timestamp."

[[alignment_extras]]
operation = "head_object"
member = "expires_string"
rust_type = "::std::string::String"
optional = true
reason = "Raw Expires header retained alongside the modeled timestamp."

[[alignment_types]]
shape = "com.amazonaws.s3#Expires"
kind = "string"
rust_type = "::aws_smithy_types::DateTime"
reason = "The SDK parses the modeled Expires header string as an HTTP timestamp."

[pagination.ListMultipartUploads]
input_tokens = ["KeyMarker", "UploadIdMarker"]
output_tokens = ["NextKeyMarker", "NextUploadIdMarker"]
page_size = "MaxUploads"
more_results = "IsTruncated"

[pagination.ListObjectVersions]
input_tokens = ["KeyMarker", "VersionIdMarker"]
output_tokens = ["NextKeyMarker", "NextVersionIdMarker"]
page_size = "MaxKeys"
more_results = "IsTruncated"

[pagination.ListObjects]
input_tokens = ["Marker"]
output_tokens = ["NextMarker || Contents[-1].Key"]
page_size = "MaxKeys"
more_results = "IsTruncated"

[pagination.ListObjectsV2]
input_tokens = ["ContinuationToken"]
output_tokens = ["NextContinuationToken"]
page_size = "MaxKeys"
more_results = "IsTruncated"

[pagination.ListParts]
input_tokens = ["PartNumberMarker"]
output_tokens = ["NextPartNumberMarker"]
page_size = "MaxParts"
more_results = "IsTruncated"
