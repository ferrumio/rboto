name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Python and codegen quality
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.catalog.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install -e codegen -e packages/rboto pytest pytest-asyncio mypy pyright ruff "pydantic>=2,<3" build hatchling twine

      - name: Service catalog
        id: catalog
        run: echo "services=$(.venv/bin/rboto-codegen list --json)" >> "$GITHUB_OUTPUT"

      - name: Fetch locked Smithy models
        run: |
          cargo fetch --locked
          .venv/bin/rboto-codegen fetch-model --all

      - name: Python lint
        run: >-
          .venv/bin/ruff check
          codegen/src codegen/tests packages/rboto/src packages/rboto/tests
          tests examples benchmarks .github/scripts

      - name: Unit tests
        run: .venv/bin/pytest codegen/tests packages/rboto/tests -q

      - name: Strict typing
        run: |
          .venv/bin/mypy --strict \
            codegen/src codegen/tests packages/rboto/src \
            packages/rboto-*/python tests/typecheck examples .github/scripts
          .venv/bin/pyright

      - name: Version consistency
        run: .venv/bin/python .github/scripts/check_version.py

      - name: Package metadata and READMEs
        run: |
          .venv/bin/python -m build --no-isolation --outdir dist/core packages/rboto
          .venv/bin/python -m build --no-isolation --outdir dist/codegen codegen
          .venv/bin/twine check --strict dist/core/* dist/codegen/*

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wheel:
    name: Wheel ${{ matrix.service }} (Linux / cp315)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.quality.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Build service wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.15.0"
          command: build
          args: --release --locked --out dist -i python3.15
          working-directory: packages/rboto-${{ matrix.service }}
          sccache: true

      - name: Install and import wheel
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/pip install packages/rboto -e codegen pytest pytest-asyncio "pydantic>=2,<3" twine
          .venv/bin/pip install packages/rboto-${{ matrix.service }}/dist/*.whl
          .venv/bin/python -c "import importlib; importlib.import_module('rboto_${{ matrix.service }}'.replace('-', '_'))"

      - name: Check wheel metadata and README
        run: .venv/bin/twine check --strict packages/rboto-${{ matrix.service }}/dist/*.whl

      - name: Compiled method contracts
        env:
          RBOTO_TEST_SERVICES: ${{ matrix.service }}
        run: >-
          .venv/bin/pytest tests/integration/test_generated_client_bridge.py
          tests/integration/test_new_client_protocols.py
          tests/integration/test_model_interop.py
          tests/integration/test_interceptors.py
          tests/integration/test_client_configuration.py
          tests/integration/test_client_transport.py -q

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.service }}-linux-cp315
          path: packages/rboto-${{ matrix.service }}/dist/*.whl
          retention-days: 1
