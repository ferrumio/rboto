name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version already present in all manifests"
        required: true
        type: string
      publish:
        description: "Publish validated artifacts to PyPI and GitHub"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      services: ${{ steps.release.outputs.services }}
      batches: ${{ steps.release.outputs.batches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Freeze release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          python .github/scripts/check_version.py --expected "$VERSION"
          python -m venv .venv
          .venv/bin/pip install -e codegen
          .venv/bin/python .github/scripts/release_catalog.py --version "$VERSION" --commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "services=$(.venv/bin/rboto-codegen list --json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-catalog
          path: release/*
          if-no-files-found: error
          retention-days: 14

  wheels:
    name: Wheels / ${{ matrix.platform.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_17", container: "quay.io/pypa/manylinux2014_x86_64:latest" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_17", container: "quay.io/pypa/manylinux2014_aarch64:latest" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, container: "quay.io/pypa/musllinux_1_2_x86_64:latest" }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, container: "quay.io/pypa/musllinux_1_2_aarch64:latest" }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "", container: "" }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, manylinux: "", container: "" }
    uses: ./.github/workflows/release-wheels.yml
    with:
      batches: ${{ needs.prepare.outputs.batches }}
      platform: ${{ matrix.platform.name }}
      runner: ${{ matrix.platform.runner }}
      target: ${{ matrix.platform.target }}
      manylinux: ${{ matrix.platform.manylinux }}
      container: ${{ matrix.platform.container }}

  service-sdist:
    name: Source batches
    needs: prepare
    uses: ./.github/workflows/release-wheels.yml
    with:
      batches: ${{ needs.prepare.outputs.batches }}
      platform: sdist
      runner: ubuntu-latest
      kind: sdist

  core:
    name: Core wheel and sdist
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --outdir dist packages/rboto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  smoke-wheelhouse:
    name: Smoke / ${{ matrix.platform.name }} / Python ${{ matrix.python }}
    needs: [prepare, wheels, core]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, container: "" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, container: "" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, container: "quay.io/pypa/musllinux_1_2_x86_64:latest" }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/musllinux_1_2_aarch64:latest" }
          - { name: macos-x86_64, runner: macos-15-intel, container: "" }
          - { name: macos-arm64, runner: macos-latest, container: "" }
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: service--*--${{ matrix.platform.name }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-catalog
          path: release
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.platform.container == ''
        with:
          python-version: ${{ matrix.python }}
      - name: Install and check native wheels
        if: matrix.platform.container == ''
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m venv .venv
          .venv/bin/pip install --only-binary=:all: --no-index --find-links dist "rboto[all]==$VERSION"
          .venv/bin/python .github/scripts/smoke_release.py release/release.json
      - name: Install and check musl wheels in musl
        if: matrix.platform.container != ''
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python }}
          IMAGE: ${{ matrix.platform.container }}
        run: |
          ABI="cp${PYTHON_VERSION//./}"
          docker run --rm --network none --cpus 2 --memory 4g \
            -v "$PWD:/io:ro" -w /tmp \
            -e VERSION -e ABI="$ABI" -e AWS_EC2_METADATA_DISABLED \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION \
            "$IMAGE" sh -eu -c '
              /opt/python/$ABI-$ABI/bin/python -m venv /tmp/venv
              /tmp/venv/bin/pip install --only-binary=:all: --no-index --find-links /io/dist "rboto[all]==$VERSION"
              /tmp/venv/bin/python /io/.github/scripts/smoke_release.py /io/release/release.json
            '

  validate:
    name: Validate complete release
    needs: [prepare, wheels, core, service-sdist, smoke-wheelhouse]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: service--*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-catalog
          path: release
      - name: Check metadata, matrix completeness, and hashes
        run: |
          pip install twine packaging
          twine check --strict dist/*
          python .github/scripts/release_artifacts.py validate
          echo "All release targets passed. Publication requires a tag or publish=true." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-services:
    name: Publish ${{ matrix.service }}
    if: github.event_name == 'push' || inputs.publish
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    environment:
      name: pypi
      url: https://pypi.org/p/rboto
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: service--${{ matrix.service }}--*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: release
      - name: Select missing files and verify existing hashes
        id: upload
        run: |
          pip install packaging
          python .github/scripts/release_artifacts.py prepare-upload --github-output "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.upload.outputs.pending == 'true'
        with:
          packages-dir: upload
      - name: Verify published files
        run: python .github/scripts/release_artifacts.py verify-published

  publish-core:
    name: Publish rboto last
    if: github.event_name == 'push' || inputs.publish
    needs: [prepare, validate, publish-services]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rboto
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: release
      - name: Select missing files and verify existing hashes
        id: upload
        run: |
          pip install packaging
          python .github/scripts/release_artifacts.py prepare-upload --github-output "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.upload.outputs.pending == 'true'
        with:
          packages-dir: upload
      - name: Verify published files
        run: python .github/scripts/release_artifacts.py verify-published

  github-release:
    name: Create GitHub release
    needs: [prepare, publish-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: service--*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: release
      - name: Publish release and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --generate-notes
          fi
          gh release upload "v$VERSION" dist/* release/SHA256SUMS release/release.json --clobber
          gh release edit "v$VERSION" --draft=false

  docs:
    needs: github-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
